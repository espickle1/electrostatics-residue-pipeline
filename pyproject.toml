[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binding-partner"
version = "0.1.0"
description = "Distance-only binding-partner classification of one residue across solved structures"
requires-python = ">=3.10"
dependencies = [
    "gemmi>=0.7",
    "freesasa>=2.2",
    "biopython>=1.83",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
binding-partner = "binding_partner.cli:main"

[tool.setuptools]
packages = ["binding_partner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
